version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Every six months: on the 1st of January and July
      interval: "semiannually"
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      # Every six months: on the 1st of January and July
      interval: "semiannually"
    groups:
      maven-minor-and-patch:
        update-types: [ "minor", "patch" ]
