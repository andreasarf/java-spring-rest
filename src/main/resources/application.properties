spring.application.name=resourceapi
# tracing: trace/span ids in log lines, X-Trace-Id response header, W3C traceparent on outgoing calls.
# Nothing is exported; add a reporter (e.g. Zipkin/OTLP) to ship spans somewhere.
management.tracing.propagation.type=w3c
# datasource
spring.datasource.url=jdbc:h2:mem:test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.sql.init.platform=h2
spring.datasource.driver-class-name=org.h2.Driver
# jpa
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
# http clients (RestClient calls to SDLC systems)
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s
# use the pooled Apache HttpClient explicitly, so pooling can't silently go away with a classpath change
spring.http.clients.imperative.factory=http-components
# pool sizing: resourceapi.http-client.pool.* (defaults in HttpClientPoolProperties)
