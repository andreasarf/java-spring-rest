spring.application.name=resourceapi
# tracing: trace/span ids in log lines, X-Trace-Id response header, W3C traceparent on outgoing calls
# (incoming W3C and B3 headers are both accepted). Nothing is exported; when adding a reporter
# (e.g. Zipkin/OTLP), lower the sampling probability to what the tracing backend can take.
management.tracing.sampling.probability=1.0
# virtual threads for request handling and the @Async task executor
spring.threads.virtual.enabled=true
# at most 8 background tasks at once; more are rejected (503) instead of piling up
spring.task.execution.thread-name-prefix=async-
spring.task.execution.simple.concurrency-limit=8
spring.task.execution.simple.reject-tasks-when-limit-reached=true
# on shutdown, let running background tasks finish (up to 10s)
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=10s
# datasource
spring.datasource.url=jdbc:h2:mem:test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.sql.init.platform=h2
spring.datasource.driver-class-name=org.h2.Driver
# jpa
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
# http clients (RestClient calls to SDLC systems)
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s
# use the pooled Apache HttpClient explicitly, so pooling can't silently go away with a classpath change
spring.http.clients.imperative.factory=http-components
# pool sizing: resourceapi.http-client.pool.* (defaults in HttpClientPoolProperties)
# OpenAPI: document at /v3/api-docs, Swagger UI at /swagger-ui.html; only the API, not internal endpoints
springdoc.paths-to-match=/api/**
