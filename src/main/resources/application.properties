spring.application.name=resourceapi
# tracing: trace/span ids in log lines, X-Trace-Id response header, W3C traceparent on outgoing calls
# (incoming W3C and B3 headers are both accepted). Nothing is exported; when adding a reporter
# (e.g. Zipkin/OTLP), lower the sampling probability to what the tracing backend can take.
management.tracing.sampling.probability=1.0
# virtual threads for request handling and the @Async task executor
spring.threads.virtual.enabled=true
# at most 8 background tasks at once; more are rejected (503) instead of piling up
spring.task.execution.thread-name-prefix=async-
spring.task.execution.simple.concurrency-limit=8
spring.task.execution.simple.reject-tasks-when-limit-reached=true
# on shutdown, let running background tasks finish (up to 10s)
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=10s
# redis (cache); spring.data.redis.host/port default to localhost:6379. Short timeouts: the cache is an
# optimization, and with Redis unreachable each cache read/write waits this long before it is skipped
# (Lettuce's default command timeout is 60s)
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
# Redis is used for caching only, not as a Spring Data repository store
spring.data.redis.repositories.enabled=false
# explicit: Redisson brings a JCache provider, which Boot would otherwise prefer over Redis
spring.cache.type=redis
spring.cache.redis.key-prefix=resourceapi::
spring.cache.redis.cache-null-values=false
resourceapi.cache.sdlc-systems-ttl=10m
resourceapi.cache.external-projects-ttl=5m
# redisson (locks, rate limiters) uses the same Redis; its object names get this prefix
resourceapi.redisson.key-prefix=resourceapi:
# a project's sync lock expires after this even if never released (e.g. the instance died)
resourceapi.sync.lock-lease-time=60s
# distributed rate limits (Redisson): calls to one SDLC system (503 + Retry-After when exceeded after
# waiting max-wait), and sync requests per project (429 + Retry-After)
resourceapi.rate-limit.sdlc.permits=10
resourceapi.rate-limit.sdlc.period=1s
resourceapi.rate-limit.sdlc.max-wait=1s
resourceapi.rate-limit.sync.permits=6
resourceapi.rate-limit.sync.period=1m
resourceapi.rate-limit.sync.max-wait=0s
# datasource
spring.datasource.url=jdbc:h2:mem:test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.sql.init.platform=h2
spring.datasource.driver-class-name=org.h2.Driver
# jpa
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
# http clients (RestClient calls to SDLC systems)
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s
# use the pooled Apache HttpClient explicitly, so pooling can't silently go away with a classpath change
spring.http.clients.imperative.factory=http-components
# pool sizing: resourceapi.http-client.pool.* (defaults in HttpClientPoolProperties)
# OpenAPI: document at /v3/api-docs, Swagger UI at /swagger-ui.html; only the API, not internal endpoints
springdoc.paths-to-match=/api/**
