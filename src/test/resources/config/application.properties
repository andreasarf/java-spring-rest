# Each test application context gets its own in-memory database so schema.sql/data.sql run on a clean slate
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE
# tests send many requests from one address; ClientRateLimitIntegrationTest sets its own limit
resourceapi.rate-limit.client.permits=100000
# no automatic syncs after creating or re-keying a project: tests would call SDLC systems they don't
# expect (SyncOnProjectChangeTest turns it on)
resourceapi.sync.on-change=false
# failed syncs are retried quickly
resourceapi.sync.retry-delay=100ms
